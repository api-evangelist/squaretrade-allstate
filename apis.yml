aid: squaretrade-allstate
name: SquareTrade (Allstate)
description: 'SquareTrade, an Allstate company, provides consumer product protection plans and extended
  warranties for smartphones, electronics, appliances, furniture, and other goods, marketed in North
  America as Allstate Protection Plans. It serves more than 140 million customers through partnerships
  with major retailers and mobile carriers across the US, Europe, Japan, and Australia, handling plan
  registration, claims filing, same-day repairs, and in-home service. SquareTrade was surfaced as a
  portfolio company of bain-capital-ventures and added to the API Evangelist network. As of this
  enrichment pass the company publishes no public developer API, developer portal, or API documentation;
  its digital surface is consumer- and partner-facing (plan portal, claims, partnerships).'
